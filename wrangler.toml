name = "telemedicina-dicom-platform"
main = "src/worker/index.ts"
compatibility_date = "2025-03-01"

[assets]
directory = "./dist/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "telemedicina-dicom-db"
database_id = "00000000-0000-0000-0000-000000000000"

# Optional Cloudflare R2 binding: when enabled in your Cloudflare account,
# uncomment the block below so binary DICOM files store directly in R2.
# When omitted, the Worker automatically stores chunked DICOM binaries in D1.
# [[r2_buckets]]
# binding = "DICOM_BUCKET"
# bucket_name = "telemedicina-dicom-files"
